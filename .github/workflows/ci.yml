name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version and the current LTS line.
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Runtime tests create commits in disposable repositories.
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.invalid"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.invalid"
      - run: pnpm install --frozen-lockfile
      # The Playwright config drives the Chrome that ships on GitHub's Ubuntu runners.
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  package:
    name: Packed tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:package
      # The published file list is a contract: nothing outside these paths may ship.
      - name: Tarball contents
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          unexpected=$(tar -tzf "$RUNNER_TEMP"/*.tgz | grep -Ev '^package/(dist/|LICENSE$|README\.md$|package\.json$|docs/architecture\.md$)' || true)
          if [ -n "$unexpected" ]; then echo "Unexpected files in the tarball:"; echo "$unexpected"; exit 1; fi
