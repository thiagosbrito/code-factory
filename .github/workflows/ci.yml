name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Runtime tests create commits in disposable repositories.
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.invalid"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The package supports Node 22.12, but pnpm itself needs 22.13, so install and build with a
  # newer Node and run the tests and the built CLI on the minimum supported one.
  minimum-node:
    name: Tests on Node 22.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.invalid"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - run: node --version
      - run: node_modules/.bin/vitest run
      - run: node dist/node/cli.js --version

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.invalid"
      - run: pnpm install --frozen-lockfile
      # The Playwright config drives the Chrome that ships on GitHub's Ubuntu runners.
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  package:
    name: Packed tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:package
      # The published file list is a contract: nothing outside these paths may ship.
      - name: Tarball contents
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          unexpected=$(tar -tzf "$RUNNER_TEMP"/*.tgz | grep -Ev '^package/(dist/|LICENSE$|README\.md$|package\.json$|docs/architecture\.md$)' || true)
          if [ -n "$unexpected" ]; then echo "Unexpected files in the tarball:"; echo "$unexpected"; exit 1; fi
